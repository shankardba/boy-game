<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Boy — a tiny diorama adventure</title>
<meta name="description" content="Boy — a miniature 3D top-down adventure in the browser, in the tilt-shift diorama style of Zelda: Link's Awakening.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #05070a; }
  body { font-family: 'Inter', sans-serif; -webkit-user-select: none; user-select: none; }

  #game-root {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #05070a;
  }

  canvas { display: block; width: 100%; height: 100%; }

  /* ---- tilt-shift diorama bands (fake depth-of-field, cheap & convincing) ---- */
  .tilt-band {
    position: absolute;
    left: 0; right: 0;
    pointer-events: none;
    z-index: 5;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .tilt-band.top {
    top: 0; height: 16%;
    background: linear-gradient(to bottom, rgba(5,7,10,0.35), rgba(5,7,10,0));
    mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
  }
  .tilt-band.bottom {
    bottom: 0; height: 20%;
    background: linear-gradient(to top, rgba(5,7,10,0.4), rgba(5,7,10,0));
    mask-image: linear-gradient(to top, black 40%, transparent 100%);
    -webkit-mask-image: linear-gradient(to top, black 40%, transparent 100%);
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    box-shadow: inset 0 0 18vw rgba(0,0,0,0.55);
  }

  /* ---- HUD ---- */
  .hud { position: absolute; z-index: 10; font-family: 'Inter', sans-serif; }

  #hearts {
    top: 16px; left: 16px;
    display: flex; gap: 6px;
  }
  #hearts svg { width: 26px; height: 26px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); }

  #shard-counter {
    top: 16px; right: 16px;
    display: flex; align-items: center; gap: 8px;
    background: rgba(5,7,10,0.55);
    border: 1px solid rgba(240,168,60,0.4);
    border-radius: 999px;
    padding: 7px 16px 7px 12px;
    color: #ffd27a;
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.3px;
    backdrop-filter: blur(6px);
  }
  #shard-counter .icon { font-size: 1rem; filter: drop-shadow(0 0 6px rgba(120,220,255,0.8)); }

  #dialogue {
    left: 50%; bottom: 8%;
    transform: translateX(-50%) translateY(12px);
    width: min(88vw, 560px);
    background: rgba(8,6,10,0.88);
    border: 1px solid rgba(240,168,60,0.55);
    border-radius: 14px;
    padding: 18px 22px 14px;
    color: #f7ece9;
    font-size: 1rem;
    line-height: 1.5;
    box-shadow: 0 14px 40px rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #dialogue.open { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  #dialogue .prompt {
    margin-top: 10px;
    font-size: 0.75rem;
    color: #c7abb8;
    text-align: right;
    animation: blink 1.1s infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

  #toast {
    left: 50%; top: 14%;
    transform: translateX(-50%) translateY(-10px);
    background: rgba(8,6,10,0.85);
    border: 1px solid rgba(255,46,166,0.55);
    border-radius: 12px;
    padding: 12px 22px;
    color: #ffd27a;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.4px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.35s ease, transform 0.35s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- start overlay ---- */
  #start-overlay {
    position: absolute; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,46,166,0.18), transparent 55%),
      radial-gradient(circle at 75% 80%, rgba(240,168,60,0.14), transparent 55%),
      #05070a;
    transition: opacity 0.5s ease;
  }
  #start-overlay.hidden { opacity: 0; pointer-events: none; }
  #start-overlay h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(3rem, 12vw, 5.5rem);
    letter-spacing: 4px;
    background: linear-gradient(135deg, #ffd27a, #f0a83c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(240,168,60,0.25);
  }
  #start-overlay p.tag {
    margin-top: 10px;
    color: #c7abb8;
    font-style: italic;
    font-size: clamp(0.9rem, 2vw, 1.05rem);
  }
  #start-overlay .controls {
    margin-top: 30px;
    display: flex; gap: 26px; flex-wrap: wrap; justify-content: center;
    color: #c7abb8; font-size: 0.82rem;
  }
  #start-overlay .controls b { color: #ffd27a; display: block; font-size: 0.75rem; letter-spacing: 1px; margin-bottom: 3px; text-transform: uppercase; }
  #begin-btn {
    margin-top: 36px;
    padding: 15px 40px;
    border-radius: 999px;
    border: 2px solid transparent;
    background: linear-gradient(135deg, #ff2ea6, #e11d5c);
    color: #17040d;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 8px 26px rgba(255,46,166,0.35);
    transition: transform 0.2s ease;
  }
  #begin-btn:hover { transform: translateY(-2px); }

  /* ---- touch controls ---- */
  .touch-controls { display: none; }
  @media (hover: none) and (pointer: coarse) {
    .touch-controls { display: block; }
  }
  #dpad {
    position: absolute; z-index: 20; left: 18px; bottom: 22px;
    width: 148px; height: 148px;
  }
  #dpad button {
    position: absolute;
    width: 50px; height: 50px;
    background: rgba(20,12,16,0.55);
    border: 1px solid rgba(240,168,60,0.4);
    border-radius: 12px;
    color: #ffd27a;
    font-size: 1.2rem;
    backdrop-filter: blur(4px);
  }
  #dpad button:active { background: rgba(255,46,166,0.35); }
  #dpad .up { top: 0; left: 49px; }
  #dpad .down { bottom: 0; left: 49px; }
  #dpad .left { left: 0; top: 49px; }
  #dpad .right { right: 0; top: 49px; }

  #action-btn {
    position: absolute; z-index: 20; right: 26px; bottom: 34px;
    width: 74px; height: 74px;
    border-radius: 50%;
    background: rgba(255,46,166,0.28);
    border: 1px solid rgba(255,46,166,0.6);
    color: #f7ece9;
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.5px;
    backdrop-filter: blur(4px);
  }
  #action-btn:active { background: rgba(255,46,166,0.5); }

  #shankfiddle-credit {
    position: absolute; z-index: 10; left: 16px; bottom: 12px;
    font-size: 0.7rem; color: rgba(199,171,184,0.55);
    letter-spacing: 0.3px;
  }
  @media (hover: none) and (pointer: coarse) { #shankfiddle-credit { display: none; } }
</style>
</head>
<body>

<div id="game-root">
  <div class="tilt-band top"></div>
  <div class="tilt-band bottom"></div>
  <div class="vignette"></div>

  <div id="hearts" class="hud"></div>
  <div id="shard-counter" class="hud"><span class="icon">&#10022;</span><span id="shard-count-text">0 / 0</span></div>
  <div id="dialogue" class="hud">
    <div id="dialogue-text"></div>
    <div class="prompt">&#9660; space to close</div>
  </div>
  <div id="toast" class="hud"></div>
  <div id="shankfiddle-credit">Boy — a shankFiddle production</div>

  <div class="touch-controls" id="dpad">
    <button class="up" data-dir="up">&#9650;</button>
    <button class="down" data-dir="down">&#9660;</button>
    <button class="left" data-dir="left">&#9664;</button>
    <button class="right" data-dir="right">&#9654;</button>
  </div>
  <button class="touch-controls" id="action-btn">ACT</button>

  <div id="start-overlay">
    <h1>BOY</h1>
    <p class="tag">a tiny diorama adventure</p>
    <div class="controls">
      <div><b>Move</b>WASD / Arrow Keys</div>
      <div><b>Interact &amp; Poke</b>Space</div>
      <div><b>Goal</b>Gather every Light Shard &#10022;</div>
    </div>
    <button id="begin-btn">Begin Adventure</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(function () {
  'use strict';

  // ========================================================================
  // LEVELS — this is the whole authoring surface. Add a new level by adding
  // a new entry here; nothing below this block needs to change.
  //
  // map:    array of equal-length strings (the grid). Legend:
  //           #  tree / solid border      .  grass          , flowers
  //           =  path                     o  rock            ~ water
  //           b  bush                     H  house footprint (any block of
  //              H tiles becomes one house prop sized to fit them)
  //           S  sign (reads signs[] in the order signs are encountered
  //              scanning the grid top-to-bottom, left-to-right)
  //           e  enemy spawn (wanders near its spawn point)
  //           $  collectible Light Shard
  //           @  player start (used when this level loads with no explicit
  //              spawn override, i.e. as the first level, or via loadLevel
  //              with no spawn argument)
  //           1-9 exit portal — walking onto a digit tile used as a key in
  //              this level's `exits` teleports the player into another
  //              level at the tile given there. Reuse the same digit for
  //              more than one portal within a level, or different digits
  //              for several distinct exits.
  //
  // signs:  array of dialogue strings, matched to 'S' tiles in scan order.
  // exits:  { '<digit>': { to: '<level id>', x: <tx>, y: <ty> } } — arrival
  //         tile in the destination level, in that level's own coordinates.
  // ========================================================================
  var LEVELS = [
    {
      id: 'clearing',
      name: 'The Clearing',
      map: [
        "###################",
        "#........$........#",
        "#..o..,,...b...o..#",
        "#....=========....#",
        "#.o..=...,,,.=..o.#",
        "#....=..HHH..=....#",
        "#..S.=..HHH..=..$.#",
        "#....=========....#",
        "1.,......@.......$#",
        "#...~~~.....o,,.o.#",
        "#..~~~~~.....e....#",
        "#...~~~.......b...#",
        "#.$.........o...$.#",
        "#..$.,,..e....,S..#",
        "###################"
      ],
      signs: [
        "A crooked signpost: \"Six Light Shards sleep in this clearing. Gather them all to wake the grove.\"",
        "Carved in the wood: \"Mind the slimes near the water — give them a poke if they get too close.\""
      ],
      exits: { '1': { to: 'hollow', x: 9, y: 4 } }
    },
    {
      id: 'hollow',
      name: 'The Hollow',
      map: [
        "###########",
        "#..o...o..#",
        "#.S.......#",
        "#...$.$...#",
        "#....@....1",
        "#....e....#",
        "#.........#",
        "#..o...o..#",
        "###########"
      ],
      signs: [
        "Scratched into stone: \"Two more shards glimmer deeper in the hollow.\""
      ],
      exits: { '1': { to: 'clearing', x: 1, y: 8 } }
    }
  ];

  var TILE = 2;

  function key(tx, ty) { return tx + ',' + ty; }
  function rand(a, b) { return a + Math.random() * (b - a); }

  // Pure — takes an explicit world so it's safe to use while building a
  // level that isn't the active one yet (see buildWorldGroup).
  function worldPos(w, tx, ty) {
    return { x: (tx - w.ORIGIN_X) * TILE, z: (ty - w.ORIGIN_Z) * TILE };
  }
  // Convenience wrapper for runtime/gameplay code, which always operates on
  // whichever level is currently active.
  function tileToWorld(tx, ty) { return worldPos(world, tx, ty); }

  // Parses a level's map into engine-agnostic data: which tiles block
  // movement, where every prop/enemy/shard/sign/portal goes, and where the
  // player starts. Doesn't touch Three.js at all.
  function parseLevel(levelDef) {
    var map = levelDef.map;
    var w = map[0].length, h = map.length;
    var exits = levelDef.exits || {};
    var obstacles = new Set();
    var features = { trees: [], rocks: [], bushes: [], flowers: [], shards: [], signs: [], enemies: [], houseTiles: [], portals: [] };
    var groundKinds = [];
    var playerStart = { x: 1, y: 1 };

    for (var y = 0; y < h; y++) {
      groundKinds.push(map[y].split(''));
      for (var x = 0; x < w; x++) {
        var c = map[y][x];
        if (exits[c]) {
          features.portals.push({ x: x, y: y, to: exits[c].to, spawn: { x: exits[c].x, y: exits[c].y } });
          continue;
        }
        switch (c) {
          case '#': obstacles.add(key(x, y)); features.trees.push({ x: x, y: y }); break;
          case 'o': obstacles.add(key(x, y)); features.rocks.push({ x: x, y: y }); break;
          case 'b': obstacles.add(key(x, y)); features.bushes.push({ x: x, y: y }); break;
          case '~': obstacles.add(key(x, y)); break;
          case 'H': obstacles.add(key(x, y)); features.houseTiles.push({ x: x, y: y }); break;
          case 'S': obstacles.add(key(x, y)); features.signs.push({ x: x, y: y, message: (levelDef.signs || [])[features.signs.length] || 'A weathered sign, worn smooth by rain.' }); break;
          case ',': features.flowers.push({ x: x, y: y }); break;
          case '$': features.shards.push({ x: x, y: y, collected: false }); break;
          case 'e': features.enemies.push({ x: x, y: y }); break;
          case '@': playerStart = { x: x, y: y }; break;
        }
      }
    }

    return {
      id: levelDef.id,
      name: levelDef.name,
      W: w, H: h,
      ORIGIN_X: (w - 1) / 2, ORIGIN_Z: (h - 1) / 2,
      exitChars: new Set(Object.keys(exits)),
      obstacles: obstacles,
      features: features,
      groundKinds: groundKinds,
      playerStart: playerStart,
      totalShards: features.shards.length
    };
  }

  // ----------------------------------------------------------------------
  // Three.js setup — level-independent (scene, camera, renderer, lights).
  // ----------------------------------------------------------------------
  var root = document.getElementById('game-root');
  var SKY_COLOR = 0xbfe3ea;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(SKY_COLOR);
  scene.fog = new THREE.Fog(SKY_COLOR, 22, 46);

  var camera = new THREE.PerspectiveCamera(30, root.clientWidth / root.clientHeight, 0.1, 100);

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(root.clientWidth, root.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  root.insertBefore(renderer.domElement, root.firstChild);

  var hemi = new THREE.HemisphereLight(0xdcefff, 0x3a5a34, 0.9);
  scene.add(hemi);

  var sun = new THREE.DirectionalLight(0xfff3d6, 1.35);
  sun.position.set(9, 16, 7);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 50;
  sun.shadow.bias = -0.0015;
  scene.add(sun);
  scene.add(sun.target);

  // ----------------------------------------------------------------------
  // Prop builders — small, chunky, low-poly "toy diorama" shapes. All
  // level-independent factories; buildWorldGroup places instances of them.
  // ----------------------------------------------------------------------
  function makeTile(kindColor, thickness) {
    var geo = new THREE.BoxGeometry(TILE * 0.97, thickness, TILE * 0.97);
    var mat = new THREE.MeshStandardMaterial({ color: kindColor, roughness: 0.9, metalness: 0.02 });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.receiveShadow = true;
    return mesh;
  }

  function groundColorFor(c) {
    if (c === '=') return new THREE.Color(0xC9A876).offsetHSL(rand(-0.01, 0.01), 0, rand(-0.03, 0.02));
    if (c === '~') return new THREE.Color(0x3aa0c9);
    // grass base, with per-tile jitter for a hand-painted look
    return new THREE.Color(0x5fae4c).offsetHSL(rand(-0.02, 0.02), rand(-0.05, 0.05), rand(-0.04, 0.03));
  }
  var PORTAL_TILE_COLOR = 0x554a66;

  function createTree() {
    var g = new THREE.Group();
    var trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.16, 0.2, 0.9, 8),
      new THREE.MeshStandardMaterial({ color: 0x7a4a2b, roughness: 0.95 })
    );
    trunk.position.y = 0.45;
    trunk.castShadow = true;
    g.add(trunk);
    var leafMat = new THREE.MeshStandardMaterial({ color: 0x3f8f4a, roughness: 0.85 });
    var tiers = [ [0.85, 0.95, 1.05], [0.65, 1.4, 1.4], [0.45, 1.85, 1.75] ];
    tiers.forEach(function (t) {
      var cone = new THREE.Mesh(new THREE.ConeGeometry(t[0], 0.85, 7), leafMat);
      cone.position.y = t[1];
      cone.rotation.y = rand(0, Math.PI);
      cone.castShadow = true;
      g.add(cone);
    });
    g.scale.setScalar(rand(0.92, 1.1));
    g.rotation.y = rand(0, Math.PI * 2);
    return g;
  }

  function createRock() {
    var g = new THREE.Group();
    var mesh = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.5, 0),
      new THREE.MeshStandardMaterial({ color: 0x9a978f, roughness: 0.95, flatShading: true })
    );
    mesh.scale.set(rand(0.9, 1.2), rand(0.6, 0.85), rand(0.9, 1.2));
    mesh.position.y = 0.32;
    mesh.rotation.set(rand(0, Math.PI), rand(0, Math.PI), rand(0, Math.PI));
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    g.add(mesh);
    return g;
  }

  function createBush() {
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: 0x3c7a3f, roughness: 0.9 });
    for (var i = 0; i < 4; i++) {
      var s = new THREE.Mesh(new THREE.SphereGeometry(0.32, 8, 8), mat);
      s.position.set(rand(-0.22, 0.22), rand(0.25, 0.45), rand(-0.22, 0.22));
      s.castShadow = true;
      g.add(s);
    }
    return g;
  }

  function createFlower() {
    var g = new THREE.Group();
    var petalColor = [0xff6fa5, 0xffd166, 0xff8c42, 0xef476f][Math.floor(rand(0, 4))];
    var stem = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.28, 5), new THREE.MeshStandardMaterial({ color: 0x4a8f3f }));
    stem.position.y = 0.14;
    g.add(stem);
    var bloom = new THREE.Mesh(new THREE.SphereGeometry(0.09, 6, 6), new THREE.MeshStandardMaterial({ color: petalColor, roughness: 0.6 }));
    bloom.position.y = 0.3;
    g.add(bloom);
    g.position.set(rand(-0.4, 0.4), 0, rand(-0.4, 0.4));
    g.scale.setScalar(rand(0.8, 1.2));
    return g;
  }

  // Sized from tile-index deltas only (no world-origin lookup), so it can
  // be built before the level that owns it has become the active world.
  // buildWorldGroup positions the returned group afterward.
  function createHouse(tiles) {
    var minX = Math.min.apply(null, tiles.map(function (t) { return t.x; }));
    var maxX = Math.max.apply(null, tiles.map(function (t) { return t.x; }));
    var minY = Math.min.apply(null, tiles.map(function (t) { return t.y; }));
    var maxY = Math.max.apply(null, tiles.map(function (t) { return t.y; }));
    var width = (maxX - minX) * TILE + TILE * 0.92;
    var depth = (maxY - minY) * TILE + TILE * 0.92;

    var g = new THREE.Group();
    var wallH = 1.7;
    var walls = new THREE.Mesh(
      new THREE.BoxGeometry(width, wallH, depth),
      new THREE.MeshStandardMaterial({ color: 0xE4C79A, roughness: 0.85 })
    );
    walls.position.y = wallH / 2;
    walls.castShadow = true;
    walls.receiveShadow = true;
    g.add(walls);

    var roof = new THREE.Mesh(
      new THREE.ConeGeometry(Math.max(width, depth) * 0.78, 1.15, 4),
      new THREE.MeshStandardMaterial({ color: 0xB5432E, roughness: 0.75 })
    );
    roof.rotation.y = Math.PI / 4;
    roof.position.y = wallH + 0.5;
    roof.castShadow = true;
    g.add(roof);

    var door = new THREE.Mesh(
      new THREE.BoxGeometry(0.6, 1.05, 0.06),
      new THREE.MeshStandardMaterial({ color: 0x5b3620 })
    );
    door.position.set(0, 0.52, depth / 2 + 0.03);
    g.add(door);

    var window1 = new THREE.Mesh(
      new THREE.BoxGeometry(0.4, 0.4, 0.05),
      new THREE.MeshStandardMaterial({ color: 0x9fd8e8, emissive: 0x2a4650, emissiveIntensity: 0.4 })
    );
    window1.position.set(width / 2 + 0.03, 1.0, 0);
    window1.rotation.y = Math.PI / 2;
    g.add(window1);

    return g;
  }

  function createSignPost() {
    var g = new THREE.Group();
    var post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.9, 6), new THREE.MeshStandardMaterial({ color: 0x6b4526 }));
    post.position.y = 0.45;
    post.castShadow = true;
    g.add(post);
    var board = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.36, 0.08), new THREE.MeshStandardMaterial({ color: 0x9c6a3c }));
    board.position.y = 0.85;
    board.castShadow = true;
    g.add(board);
    return g;
  }

  function createShard() {
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: 0x7ee8ff, emissive: 0x2fb8e0, emissiveIntensity: 0.9, roughness: 0.25, metalness: 0.3 });

  // ----------------------------------------------------------------------
  // World construction / teardown — turns parsed level data into a Three.js
  // group. This is the only place that touches the scene graph per level.
  // ----------------------------------------------------------------------
  function buildWorldGroup(w) {
    var group = new THREE.Group();
    var waterTiles = [];

    for (var gy = 0; gy < w.H; gy++) {
      for (var gx = 0; gx < w.W; gx++) {
        var ch = w.groundKinds[gy][gx];
        var isPortal = w.exitChars.has(ch);
        var thickness = ch === '~' ? 0.16 : 0.3;
        var color = isPortal ? PORTAL_TILE_COLOR : groundColorFor(ch);
        var tileMesh = makeTile(color, thickness);
        var pos = worldPos(w, gx, gy);
        tileMesh.position.set(pos.x, thickness / -2 + (ch === '~' ? 0.02 : 0.15), pos.z);
        group.add(tileMesh);
        if (ch === '~') waterTiles.push({ mesh: tileMesh, phase: rand(0, Math.PI * 2), baseY: tileMesh.position.y });
      }
    }

    function place(list, builder) {
      list.forEach(function (f) {
        var p = worldPos(w, f.x, f.y);
        var obj = builder();
        obj.position.x += p.x;
        obj.position.z += p.z;
        group.add(obj);
        f.obj = obj;
      });
    }

    place(w.features.trees, createTree);
    place(w.features.rocks, createRock);
    place(w.features.bushes, createBush);
    place(w.features.flowers, createFlower);
    place(w.features.signs, createSignPost);
    place(w.features.portals, createPortalMarker);

    if (w.features.houseTiles.length) {
      var hMinX = Math.min.apply(null, w.features.houseTiles.map(function (t) { return t.x; }));
      var hMaxX = Math.max.apply(null, w.features.houseTiles.map(function (t) { return t.x; }));
      var hMinY = Math.min.apply(null, w.features.houseTiles.map(function (t) { return t.y; }));
      var hMaxY = Math.max.apply(null, w.features.houseTiles.map(function (t) { return t.y; }));
      var hc1 = worldPos(w, hMinX, hMinY), hc2 = worldPos(w, hMaxX, hMaxY);
      var house = createHouse(w.features.houseTiles);
      house.position.set((hc1.x + hc2.x) / 2, 0, (hc1.z + hc2.z) / 2);
      group.add(house);
    }

    place(w.features.shards, createShard);

    var enemies = w.features.enemies.map(function (f) {
      var p = worldPos(w, f.x, f.y);
      var obj = createBlob();
      obj.position.set(p.x, 0, p.z);
      group.add(obj);
      return {
        obj: obj,
        spawn: { x: p.x, z: p.z },
        target: { x: p.x, z: p.z },
        alive: true,
        retarget: 0,
        respawnTimer: 0,
        bobPhase: rand(0, Math.PI * 2)
      };
    });

    return { group: group, waterTiles: waterTiles, enemies: enemies };
  }

  function disposeGroup(group) {
    group.traverse(function (obj) {
      if (obj.isMesh) {
        if (obj.geometry && obj.geometry !== DEBRIS_GEO) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach(function (m) { m.dispose(); });
          else obj.material.dispose();
        }
      }
    });
  }

  // ----------------------------------------------------------------------
  // Defeat explosions — chunky debris + an expanding flash ring, purely
  // additive visual state updated each frame and discarded once expired.
  // Parented to whichever level group is currently active.
  // ----------------------------------------------------------------------
  var effects = [];
  var DEBRIS_GEO = new THREE.IcosahedronGeometry(0.09, 0);
  var GRAVITY = 9;

  function spawnExplosion(pos, color) {
    var group = new THREE.Group();
    group.position.copy(pos);
    group.position.y += 0.34;
    world.group.add(group);

    var debrisMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5, transparent: true, opacity: 1 });
    var pieces = [];
    var count = 10;
    for (var i = 0; i < count; i++) {
      var piece = new THREE.Mesh(DEBRIS_GEO, debrisMat);
      piece.scale.setScalar(rand(0.55, 1.3));
      var angle = (i / count) * Math.PI * 2 + rand(-0.3, 0.3);
      var speed = rand(1.6, 3.4);
      piece.userData.vel = new THREE.Vector3(Math.cos(angle) * speed, rand(2.0, 3.6), Math.sin(angle) * speed);
      piece.userData.spin = new THREE.Vector3(rand(-7, 7), rand(-7, 7), rand(-7, 7));
      group.add(piece);
      pieces.push(piece);
    }

    var flashMat = new THREE.MeshBasicMaterial({ color: 0xfff3d6, transparent: true, opacity: 0.85 });
    var flash = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 8), flashMat);
    group.add(flash);

    effects.push({ group: group, debrisMat: debrisMat, pieces: pieces, flash: flash, flashMat: flashMat, age: 0, life: 0.7 });
  }

  function updateEffects(dt) {
    for (var i = effects.length - 1; i >= 0; i--) {
      var fx = effects[i];
      fx.age += dt;
      var t = fx.age / fx.life;
      if (t >= 1) {
        world.group.remove(fx.group);
        effects.splice(i, 1);
        continue;
      }
      fx.pieces.forEach(function (p) {
        p.userData.vel.y -= GRAVITY * dt;
        p.position.addScaledVector(p.userData.vel, dt);
        p.rotation.x += p.userData.spin.x * dt;
        p.rotation.y += p.userData.spin.y * dt;
        p.rotation.z += p.userData.spin.z * dt;
      });
      fx.debrisMat.opacity = 1 - t;
      var flashT = Math.min(1, t / 0.3);
      fx.flash.scale.setScalar(0.3 + flashT * 2.2);
      fx.flashMat.opacity = (1 - flashT) * 0.85;
    }
  }

  // ----------------------------------------------------------------------
  // Player state
  // ----------------------------------------------------------------------
  var DIR_VEC = { up: { dx: 0, dz: -1 }, down: { dx: 0, dz: 1 }, left: { dx: -1, dz: 0 }, right: { dx: 1, dz: 0 } };
  var DIR_ROT = { down: 0, up: Math.PI, right: Math.PI / 2, left: -Math.PI / 2 };

  // The player's facing direction is remembered independent of movement —
  // set the instant a direction is pressed, not deferred to the next move
  // tick, so even a very quick tap (or a tap+release inside one frame)
  // still turns the character and is remembered for a direction-less attack.
  function setFacing(dir) {
    player.facing = dir;
    player.obj.rotation.y = DIR_ROT[dir];
  }

  var player = {
    obj: createPlayer(),
    tileX: 0,
    tileY: 0,
    facing: 'down',
    isMoving: false,
    moveElapsed: 0,
    from: null,
    to: null,
    hearts: 3,
    maxHearts: 3,
    invulnTimer: 0,
    attackCooldown: 0,
    attackAnim: 0
  };

  var MOVE_DURATION = 0.17;
  var ATTACK_DURATION = 0.26;
  var ATTACK_COOLDOWN = 0.4;
  var ATTACK_HIT_RADIUS = 1.05;
  var SWORD_SWING_FROM = -1.5;
  var SWORD_SWING_TO = 0.9;

  // ----------------------------------------------------------------------
  // Camera
  // ----------------------------------------------------------------------
  var camOffset = new THREE.Vector3(0, 10.5, 6.2);
  var camLookAhead = new THREE.Vector3(0, 0.6, -1.1);

  window.addEventListener('resize', function () {
    camera.aspect = root.clientWidth / root.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(root.clientWidth, root.clientHeight);
  });

  // ----------------------------------------------------------------------
  // Level loading — the level-switching engine. loadLevel() is the whole
  // API: tear down the current level's group (if any), build the new one,
  // drop the player at the right spawn tile, and snap the camera/shadow
  // frustum to fit.
  // ----------------------------------------------------------------------
  var world = null;
  var LEVEL_INDEX = {};
  LEVELS.forEach(function (lvl, i) { LEVEL_INDEX[lvl.id] = i; });

  function loadLevel(index, spawnOverride) {
    var levelDef = LEVELS[index];
    var newWorld = parseLevel(levelDef);
    var built = buildWorldGroup(newWorld);
    newWorld.group = built.group;
    newWorld.waterTiles = built.waterTiles;
    newWorld.enemies = built.enemies;
    newWorld.shardsCollected = 0;
    newWorld.maxShards = newWorld.totalShards;

    if (world) {
      scene.remove(world.group);
      disposeGroup(world.group);
    }
    effects.length = 0;

    world = newWorld;
    scene.add(world.group);
    world.group.add(player.obj);

    var spawnTile = spawnOverride || world.playerStart;
    player.tileX = spawnTile.x;
    player.tileY = spawnTile.y;
    player.isMoving = false;
    var p = tileToWorld(player.tileX, player.tileY);
    player.obj.position.set(p.x, 0, p.z);

    var shadowSpan = Math.max(world.W, world.H) * TILE * 0.6;
    sun.shadow.camera.left = -shadowSpan;
    sun.shadow.camera.right = shadowSpan;
    sun.shadow.camera.top = shadowSpan;
    sun.shadow.camera.bottom = -shadowSpan;
    sun.shadow.camera.updateProjectionMatrix();

    renderShardCount();
    dialogueOpen = false;
    closeDialogue();

    // Snap instantly rather than lerping — panning across the old map on
    // the way to the new one would look broken.
    camera.position.copy(player.obj.position).add(camOffset);
    camera.lookAt(player.obj.position.clone().add(camLookAhead));

    showToast(levelDef.name, 2000);
  }

  // ----------------------------------------------------------------------
  // Audio — tiny synthesized SFX, no external files
  // ----------------------------------------------------------------------
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function tone(freq, start, dur, type, gain) {
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    g.gain.value = 0;
    osc.connect(g);
    g.connect(audioCtx.destination);
    var t0 = audioCtx.currentTime + start;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain || 0.18, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  function sweep(freqFrom, freqTo, start, dur, type, gain) {
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.connect(g);
    g.connect(audioCtx.destination);
    var t0 = audioCtx.currentTime + start;
    osc.frequency.setValueAtTime(freqFrom, t0);
    osc.frequency.exponentialRampToValueAtTime(freqTo, t0 + dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain || 0.16, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  function sfxPickup() { tone(660, 0, 0.12, 'triangle'); tone(880, 0.07, 0.14, 'triangle'); tone(1180, 0.14, 0.2, 'triangle'); }
  function sfxHit() { tone(180, 0, 0.18, 'sawtooth', 0.22); tone(110, 0.05, 0.22, 'sawtooth', 0.18); }
  function sfxDefeat() { tone(500, 0, 0.08, 'square', 0.15); tone(260, 0.05, 0.12, 'square', 0.12); sweep(240, 50, 0, 0.22, 'sawtooth', 0.16); }
  function sfxWin() { [523, 659, 784, 1046].forEach(function (f, i) { tone(f, i * 0.12, 0.28, 'triangle'); }); }
  function sfxBump() { tone(140, 0, 0.06, 'square', 0.08); }
  function sfxSwing() { sweep(900, 260, 0, 0.14, 'sawtooth', 0.1); }
  function sfxPortal() { tone(440, 0, 0.14, 'sine', 0.14); tone(660, 0.08, 0.2, 'sine', 0.14); tone(880, 0.16, 0.26, 'sine', 0.12); }

  // ----------------------------------------------------------------------
  // HUD
  // ----------------------------------------------------------------------
  var heartsEl = document.getElementById('hearts');
  function heartSVG(filled) {
    var fill = filled ? '#ff2ea6' : 'rgba(255,255,255,0.12)';
    var stroke = filled ? '#ffd27a' : 'rgba(240,168,60,0.4)';
    return '<svg viewBox="0 0 32 29" xmlns="http://www.w3.org/2000/svg"><path d="M16 28 C16 28 2 18.5 2 9.8 C2 4.9 5.8 1.5 10 1.5 C12.8 1.5 15 3 16 5.2 C17 3 19.2 1.5 22 1.5 C26.2 1.5 30 4.9 30 9.8 C30 18.5 16 28 16 28 Z" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.4"/></svg>';
  }
  function renderHearts() {
    var html = '';
    for (var i = 0; i < player.maxHearts; i++) html += heartSVG(i < player.hearts);
    heartsEl.innerHTML = html;
  }
  renderHearts();

  var shardCountText = document.getElementById('shard-count-text');
  function renderShardCount() { shardCountText.textContent = world.shardsCollected + ' / ' + world.maxShards; }

  var dialogueEl = document.getElementById('dialogue');
  var dialogueTextEl = document.getElementById('dialogue-text');
  var dialogueOpen = false;
  function openDialogue(text) {
    dialogueTextEl.textContent = text;
    dialogueEl.classList.add('open');
    dialogueOpen = true;
  }
  function closeDialogue() {
    dialogueEl.classList.remove('open');

  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(text, duration) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, duration || 2400);

  // ----------------------------------------------------------------------
  // Input
  // ----------------------------------------------------------------------
  var pressedDirs = [];
  var KEY_DIR = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
  var KEY_DIR_BY_KEY = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };

  function dirFromEvent(e) { return (e.code && KEY_DIR[e.code]) || KEY_DIR_BY_KEY[e.key]; }
  function isActionKey(e) { return e.code === 'Space' || e.code === 'KeyE' || e.key === ' ' || e.key === 'Spacebar' || e.key === 'e' || e.key === 'E'; }

  function pushDir(dir) {
    var idx = pressedDirs.indexOf(dir);
    if (idx !== -1) pressedDirs.splice(idx, 1);
    pressedDirs.push(dir);
  }
  function releaseDir(dir) {
    var idx = pressedDirs.indexOf(dir);
    if (idx !== -1) pressedDirs.splice(idx, 1);
  }

  window.addEventListener('keydown', function (e) {
    var dir = dirFromEvent(e);
    if (dir) { pushDir(dir); setFacing(dir); e.preventDefault(); }
    else if (isActionKey(e)) { handleAction(); e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) {
    var dir = dirFromEvent(e);
    if (dir) releaseDir(dir);
  });

  document.querySelectorAll('#dpad button').forEach(function (btn) {
    var dir = btn.getAttribute('data-dir');
    btn.addEventListener('pointerdown', function (e) { e.preventDefault(); pushDir(dir); setFacing(dir); });
    btn.addEventListener('pointerup', function () { releaseDir(dir); });
    btn.addEventListener('pointerleave', function () { releaseDir(dir); });
  });
  document.getElementById('action-btn').addEventListener('pointerdown', function (e) { e.preventDefault(); handleAction(); });

  function findNearbySign() {
    var signs = world.features.signs;
    for (var i = 0; i < signs.length; i++) {
      var s = signs[i];
      var dx = Math.abs(s.x - player.tileX), dy = Math.abs(s.y - player.tileY);
      if (dx + dy <= 1) return s;
    }
    return null;
  }

  function handleAction() {
    ensureAudio();
    if (dialogueOpen) { closeDialogue(); return; }
    var sign = findNearbySign();
    if (sign) { openDialogue(sign.message); return; }
    performAttack();
  }

  function performAttack() {
    if (player.attackCooldown > 0) return;
    // Attack whichever direction is currently held (so "left + space" swings
    // left even if the player hasn't finished turning to face that way yet);
    // fall back to the last direction faced if no direction key is held.
    var dir = pressedDirs.length ? pressedDirs[pressedDirs.length - 1] : player.facing;
    setFacing(dir);
    player.attackCooldown = ATTACK_COOLDOWN;
    player.attackAnim = ATTACK_DURATION;
    sfxSwing();

    var vec = DIR_VEC[dir];
    var target = tileToWorld(player.tileX + vec.dx, player.tileY + vec.dz);
    var here = tileToWorld(player.tileX, player.tileY);
    world.enemies.forEach(function (en) {
      if (!en.alive) return;
      var dx1 = en.obj.position.x - target.x, dz1 = en.obj.position.z - target.z;
      var dx2 = en.obj.position.x - here.x, dz2 = en.obj.position.z - here.z;
      var hitsTargetTile = Math.sqrt(dx1 * dx1 + dz1 * dz1) < ATTACK_HIT_RADIUS;
      var hitsOwnTile = Math.sqrt(dx2 * dx2 + dz2 * dz2) < ATTACK_HIT_RADIUS;
      if (hitsTargetTile || hitsOwnTile) defeatEnemy(en);
    });
  }

  function defeatEnemy(en) {
    en.alive = false;
    en.obj.visible = false;
    en.respawnTimer = 6;
    spawnExplosion(en.obj.position, 0x8f5fd6);
    sfxDefeat();
  }

  // ----------------------------------------------------------------------
  // Begin overlay
  // ----------------------------------------------------------------------
  var started = false;
  document.getElementById('begin-btn').addEventListener('click', function () {
    ensureAudio();
    document.getElementById('start-overlay').classList.add('hidden');
    started = true;
  });

  // ----------------------------------------------------------------------
  // Update loop
  // ----------------------------------------------------------------------
  function inBounds(tx, ty) { return tx >= 0 && ty >= 0 && tx < world.W && ty < world.H; }

  function attemptMove(dir) {
    setFacing(dir);
    if (player.isMoving) return;
    var vec = DIR_VEC[dir];
    var ntx = player.tileX + vec.dx, nty = player.tileY + vec.dz;
    if (!inBounds(ntx, nty) || world.obstacles.has(key(ntx, nty))) { sfxBump(); return; }
    player.from = tileToWorld(player.tileX, player.tileY);
    player.to = tileToWorld(ntx, nty);
    player.tileX = ntx;
    player.tileY = nty;
    player.isMoving = true;
    player.moveElapsed = 0;
  }

  function checkShardPickup() {
    world.features.shards.forEach(function (s) {
      if (s.collected) return;
      if (s.x === player.tileX && s.y === player.tileY) {
        s.collected = true;
        s.obj.visible = false;
        world.shardsCollected++;
        renderShardCount();
        sfxPickup();
        if (world.shardsCollected === world.maxShards) {
          setTimeout(function () { showToast('✦ Every Light Shard is found — the grove is at peace ✦', 3600); sfxWin(); }, 150);
        } else {
          showToast('Light Shard found! (' + world.shardsCollected + ' / ' + world.maxShards + ')', 1600);
        }
      }
    });
  }

  function checkPortal() {
    var portals = world.features.portals;
    for (var i = 0; i < portals.length; i++) {
      var p = portals[i];
      if (p.x === player.tileX && p.y === player.tileY) {
        var destIndex = LEVEL_INDEX[p.to];
        if (destIndex !== undefined) {
          sfxPortal();
          loadLevel(destIndex, p.spawn);
        }
        return;
      }
    }
  }

  function respawnPlayer() {
    player.tileX = world.playerStart.x;
    player.tileY = world.playerStart.y;
    var p = tileToWorld(player.tileX, player.tileY);
    player.obj.position.set(p.x, 0, p.z);
    player.isMoving = false;
    player.hearts = player.maxHearts;
    renderHearts();
    showToast('A warm light carries you back...', 2200);
  }

  var clock = new THREE.Clock();

  function update() {
    var dt = Math.min(clock.getDelta(), 0.05);
    var t = clock.elapsedTime;

    if (started) {
      if (player.isMoving) {
        player.moveElapsed += dt;
        var frac = Math.min(1, player.moveElapsed / MOVE_DURATION);
        player.obj.position.x = player.from.x + (player.to.x - player.from.x) * frac;
        player.obj.position.z = player.from.z + (player.to.z - player.from.z) * frac;
        player.obj.position.y = Math.sin(frac * Math.PI) * 0.16;
        var swing = Math.sin(frac * Math.PI * 2) * 0.5;
        player.obj.userData.legL.rotation.x = swing;
        player.obj.userData.legR.rotation.x = -swing;
        if (frac >= 1) {
          player.isMoving = false;
          player.obj.position.y = 0;
          player.obj.userData.legL.rotation.x = 0;
          player.obj.userData.legR.rotation.x = 0;
          checkShardPickup();
          checkPortal();
        }
      } else if (!dialogueOpen) {
        var dir = pressedDirs[pressedDirs.length - 1];
        if (dir) attemptMove(dir);
        var breathe = 1 + Math.sin(t * 2.4) * 0.015;
        player.obj.userData.pivot.scale.set(1, breathe, 1);
      }

      if (player.attackCooldown > 0) player.attackCooldown -= dt;
      var swordPivot = player.obj.userData.swordPivot;
      if (player.attackAnim > 0) {
        player.attackAnim -= dt;
        var swingT = Math.min(1, 1 - Math.max(0, player.attackAnim) / ATTACK_DURATION);
        var eased = 1 - Math.pow(1 - swingT, 2);
        swordPivot.visible = true;
        swordPivot.rotation.y = SWORD_SWING_FROM + (SWORD_SWING_TO - SWORD_SWING_FROM) * eased;
        player.obj.userData.pivot.rotation.y = Math.sin(swingT * Math.PI) * 0.3;
        if (player.attackAnim <= 0) {
          swordPivot.visible = false;
          player.obj.userData.pivot.rotation.y = 0;
        }
      }

      if (player.invulnTimer > 0) {
        player.invulnTimer -= dt;
        player.obj.visible = Math.floor(t * 14) % 2 === 0;
        if (player.invulnTimer <= 0) player.obj.visible = true;
      }

      // enemies: wander near spawn, squash-stretch bob, check contact damage
      world.enemies.forEach(function (en) {
        if (!en.alive) {
          en.respawnTimer -= dt;
          if (en.respawnTimer <= 0) {
            en.alive = true;
            en.obj.visible = true;
            en.obj.position.set(en.spawn.x, 0, en.spawn.z);
            en.target = { x: en.spawn.x, z: en.spawn.z };
          }
          return;
        }
        en.retarget -= dt;
        if (en.retarget <= 0) {
          en.retarget = rand(1.4, 2.6);
          var ang = rand(0, Math.PI * 2), r = rand(0.3, 1.6);
          en.target = { x: en.spawn.x + Math.cos(ang) * r, z: en.spawn.z + Math.sin(ang) * r };
        }
        var ex = en.obj.position.x, ez = en.obj.position.z;
        var tdx = en.target.x - ex, tdz = en.target.z - ez;
        var tdist = Math.sqrt(tdx * tdx + tdz * tdz);
        if (tdist > 0.05) {
          var speed = 0.7 * dt;
          en.obj.position.x += (tdx / tdist) * speed;
          en.obj.position.z += (tdz / tdist) * speed;
          en.obj.rotation.y = Math.atan2(tdx, tdz);
        }
        en.bobPhase += dt * 5;
        var squash = 1 + Math.sin(en.bobPhase) * 0.12;
        en.obj.userData.body.scale.set(1 / squash, squash, 1 / squash);

        if (player.invulnTimer <= 0) {
          var dx = en.obj.position.x - player.obj.position.x;
          var dz = en.obj.position.z - player.obj.position.z;
          if (Math.sqrt(dx * dx + dz * dz) < 0.85) {
            player.hearts--;
            renderHearts();
            sfxHit();
            player.invulnTimer = 1.3;
            if (player.hearts <= 0) {
              setTimeout(respawnPlayer, 200);
            }
          }
        }
      });

      updateEffects(dt);

      world.waterTiles.forEach(function (wt) {
        wt.mesh.position.y = wt.baseY + Math.sin(t * 1.6 + wt.phase) * 0.03;
      });
      world.features.shards.forEach(function (s) {
        if (s.collected || !s.obj) return;
        s.obj.userData.spin.rotation.y = t * 1.6;
        s.obj.userData.spin.position.y = 0.55 + Math.sin(t * 2.2) * 0.08;
      });
      world.features.portals.forEach(function (p) {
        if (!p.obj) return;
        p.obj.userData.bob.position.y = 0.58 + Math.sin(t * 3 + p.x) * 0.06;
      });

      var desiredCamPos = player.obj.position.clone().add(camOffset);
      camera.position.lerp(desiredCamPos, 1 - Math.pow(0.0008, dt));
      var lookTarget = player.obj.position.clone().add(camLookAhead);
      camera.lookAt(player.obj.position.clone().add(new THREE.Vector3(0, 0.6, 0)).lerp(lookTarget, 1));
    }

    renderer.render(scene, camera);
    requestAnimationFrame(update);
  }

  loadLevel(0);
  requestAnimationFrame(update);
})();
</script>
